<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSS Weighing Sheet — BRIC1 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;background:#f5f5f0;color:#1a1a18;min-height:100vh}
  .topbar{background:#1a1a18;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px}
  .topbar h1{font-size:16px;font-weight:600;letter-spacing:.02em}
  .topbar .event{font-size:13px;color:#888;margin-left:auto}
  .topbar .dot{width:8px;height:8px;border-radius:50%;background:#3ecf8e;flex-shrink:0}
  .controls{display:flex;gap:10px;padding:16px 24px;background:#fff;border-bottom:1px solid #e8e8e4;flex-wrap:wrap;align-items:center}
  .controls label{font-size:12px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
  .controls select{border:1px solid #ddd;border-radius:6px;padding:9px 12px;font-size:15px;background:#fff;color:#1a1a18;cursor:pointer;outline:none}
  .controls select:focus{border-color:#1a1a18}
  .userbox{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;color:#cfcfc8}
  .role-badge{background:#2b2b28;color:#fff;border:1px solid #44443f;border-radius:999px;padding:4px 9px;font-size:12px;text-transform:uppercase}
  button{border:1px solid #d8d8d2;border-radius:6px;background:#fff;color:#1a1a18;padding:9px 14px;font-size:15px;cursor:pointer}
  button:hover{background:#f4f4ef}
  button.danger{color:#991b1b;border-color:#f2c7c7}
  .app{display:none}
  body.authed .app{display:block}
  body.authed .login-wrap{display:none}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-panel{width:100%;max-width:360px;background:#fff;border:1px solid #e8e8e4;border-radius:10px;padding:24px}
  .login-panel h1{font-size:20px;margin-bottom:6px}
  .login-panel p{font-size:13px;color:#777;margin-bottom:18px}
  .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .form-row label{font-size:12px;color:#777;font-weight:600}
  input[type=text],input[type=password],input[type=number]{border:1px solid #e0e0dc;border-radius:6px;padding:9px 10px;font-size:16px;background:#fafaf8;outline:none;transition:border .15s}
  input[type=text]:focus,input[type=password]:focus,input[type=number]:focus{border-color:#1a1a18;background:#fff}
  .login-error{min-height:18px;color:#dc2626;font-size:12px;margin-bottom:10px}
  .admin-panel{display:none;gap:10px;padding:14px 24px;background:#fff;border-bottom:1px solid #e8e8e4;flex-wrap:wrap;align-items:end}
  body.role-admin .admin-panel{display:flex}
  .admin-panel .form-row{margin-bottom:0;min-width:120px}
  .admin-panel input{width:140px}
  .action-col{display:none}
  body.role-admin .action-col{display:table-cell}
  .readonly-val{display:inline-block;min-width:48px;color:#555}
  .legend{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:12px;color:#888}
  .leg{display:flex;align-items:center;gap:5px}
  .leg-dot{width:8px;height:8px;border-radius:50%}
  .main{padding:20px 24px}
  .table-card{background:#fff;border-radius:10px;border:1px solid #e8e8e4;overflow:auto;max-height:calc(100vh - 250px)}
  table{width:100%;border-collapse:collapse}
  th{background:#f9f9f7;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#888;padding:10px 12px;text-align:left;border-bottom:1px solid #e8e8e4;white-space:nowrap;position:sticky;top:0;z-index:2}
  td{padding:9px 12px;border-bottom:1px solid #f0f0ec;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafaf8}
  .num-badge{width:34px;height:34px;border-radius:6px;background:#f0f0ec;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .sub-tag{font-size:11px;background:#f0f0ec;border-radius:4px;padding:2px 7px;color:#555;font-weight:500}
  .target-val{font-size:13px;font-weight:500;color:#1a1a18}
  td input[type=text],td input[type=number]{width:110px;text-align:right;font-size:16px;padding:9px 10px}
  input[type=number]::-webkit-inner-spin-button{opacity:.4}
  .total-val{font-weight:700;font-size:14px}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .pill.ok{background:#dcfce7;color:#166534}
  .pill.warn{background:#fef3c7;color:#92400e}
  .pill.over{background:#fee2e2;color:#991b1b}
  .pill.empty{background:#f3f4f6;color:#9ca3af}
  .pct-text{font-size:12px;color:#999}
  .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid #e8e8e4;border-radius:10px;padding:14px 16px}
  .stat-label{font-size:11px;color:#999;font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .stat-val{font-size:26px;font-weight:700;line-height:1}
  .stat-val.ok{color:#16a34a}
  .stat-val.warn{color:#d97706}
  .stat-val.bad{color:#dc2626}
  .no-data{padding:40px;text-align:center;color:#aaa;font-size:13px}
  @media(max-width:700px){
    .topbar{padding:12px 16px}
    .controls{padding:12px 16px}
    .userbox{width:100%;margin-left:24px;justify-content:space-between}
    .admin-panel{padding:12px 16px}
    .main{padding:12px 16px}
    .summary{grid-template-columns:repeat(3,1fr)}
    td input[type=text],td input[type=number]{width:82px;font-size:15px}
    th,td{padding:8px 8px}
    .legend{display:none}
  }
</style>
</head>

<div class="login-wrap">
  <form class="login-panel" onsubmit="login(event)">
    <h1>TSS Weighing Sheet</h1>
    <p>เข้าสู่ระบบเพื่อใช้งาน BRIC1 · 2026</p>
    <div class="form-row">
      <label for="login-user">Username</label>
      <input id="login-user" type="text" autocomplete="username" required>
    </div>
    <div class="form-row">
      <label for="login-pass">Password</label>
      <input id="login-pass" type="password" autocomplete="current-password" required>
    </div>
    <div class="login-error" id="login-error"></div>
    <button type="submit">Login</button>
  </form>
</div>

<div class="app">
  <div class="topbar">
    <div class="dot"></div>
    <h1>TSS Weighing Sheet</h1>
    <span class="event">BRIC1 · 2026</span>
    <div class="userbox">
      <span id="active-user"></span>
      <span class="role-badge" id="active-role"></span>
      <button type="button" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="controls">
    <label>คลาส</label>
    <select id="sel-class" onchange="onClassChange()"></select>
    <label>รอบ</label>
    <select id="sel-session" onchange="render()"></select>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#16a34a"></div>ผ่าน ≤5%</div>
      <div class="leg"><div class="leg-dot" style="background:#d97706"></div>เกิน &gt;5%</div>
      <div class="leg"><div class="leg-dot" style="background:#dc2626"></div>ต่ำกว่า target</div>
    </div>
  </div>

  <div class="admin-panel">
    <div class="form-row">
      <label for="new-num">เบอร์</label>
      <input id="new-num" type="text" inputmode="numeric" placeholder="เบอร์รถ">
    </div>
    <div class="form-row">
      <label for="new-sub">รุ่น</label>
      <input id="new-sub" type="text" placeholder="รุ่น">
    </div>
    <div class="form-row">
      <label for="new-target">Target (kg)</label>
      <input id="new-target" type="number" step="0.01" placeholder="0">
    </div>
    <button type="button" onclick="addCar()">เพิ่มรถ</button>
    <button type="button" class="danger" onclick="resetData()">Reset data</button>
  </div>

  <div class="main">
    <div class="summary" id="summary"></div>
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>เบอร์</th>
            <th>รุ่น</th>
            <th>Target (kg)</th>
            <th>ชั่ง 1 (kg)</th>
            <th>ชั่ง 2 (kg)</th>
            <th>รวม (kg)</th>
            <th>Diff</th>
            <th>%</th>
            <th class="action-col">Action</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

let DATA = loadData();
let weights = loadWeights();

const selClass=document.getElementById('sel-class');
const selSess=document.getElementById('sel-session');

function clone(value){ return JSON.parse(JSON.stringify(value)); }

function loadData(){
  try{
    const saved=localStorage.getItem(STORAGE_KEYS.data);
    return saved?JSON.parse(saved):clone(DEFAULT_DATA);
  }catch(e){
    return clone(DEFAULT_DATA);
  }
}

function loadWeights(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEYS.weights)||'{}');
  }catch(e){
    return {};
  }
}

function saveData(){ localStorage.setItem(STORAGE_KEYS.data,JSON.stringify(DATA)); }
function saveWeights(){ localStorage.setItem(STORAGE_KEYS.weights,JSON.stringify(weights)); }

function currentUser(){
  const username=sessionStorage.getItem(STORAGE_KEYS.user);
  return username&&USERS[username]?{username,...USERS[username]}:null;
}

function canEditMaster(){ return currentUser()?.role==='admin'; }
function canKeyIn(){ return ['admin','keyin'].includes(currentUser()?.role); }

function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function attr(value){ return escapeHtml(value); }
function jsArg(value){ return attr(JSON.stringify(String(value))); }
function fmtWeight(value){ return value?String(value):''; }
function targetText(target){ return target!=null?Number(target).toFixed(2):'<span style="color:#ccc">—</span>'; }
function key(cls,sess,num){ return cls+'|'+sess+'|'+num; }
function getW(cls,sess,num,f){ return (weights[key(cls,sess,num)]||{})[f]||0; }

function login(event){
  event.preventDefault();
  const username=document.getElementById('login-user').value.trim();
  const password=document.getElementById('login-pass').value;
  const user=USERS[username];
  if(!user||user.password!==password){
    document.getElementById('login-error').textContent='Username หรือ Password ไม่ถูกต้อง';
    return;
  }
  sessionStorage.setItem(STORAGE_KEYS.user,username);
  document.getElementById('login-pass').value='';
  initApp();
}

function logout(){
  sessionStorage.removeItem(STORAGE_KEYS.user);
  document.body.className='';
  document.getElementById('login-error').textContent='';
  document.getElementById('login-user').focus();
}

function setW(cls,sess,num,f,v){
  if(!canKeyIn())return;
  const k=key(cls,sess,num);
  if(!weights[k])weights[k]={};
  const parsed=parseFloat(v);
  weights[k][f]=Number.isFinite(parsed)?parsed:0;
  saveWeights();
  render();
}

function setCarField(cls,sess,index,field,value){
  if(!canEditMaster())return;
  const car=DATA[cls]?.[sess]?.[index];
  if(!car)return;
  const oldNum=car.num;
  if(field==='target'){
    const trimmed=String(value).trim();
    car.target=trimmed===''?null:parseFloat(trimmed);
    if(Number.isNaN(car.target))car.target=null;
  }else{
    car[field]=String(value).trim();
  }
  if(field==='num'&&oldNum!==car.num){
    const oldKey=key(cls,sess,oldNum);
    const newKey=key(cls,sess,car.num);
    if(weights[oldKey]&&!weights[newKey])weights[newKey]=weights[oldKey];
    delete weights[oldKey];
    saveWeights();
  }
  saveData();
  render();
}

function addCar(){
  if(!canEditMaster())return;
  const cls=selClass.value;
  const sess=selSess.value;
  const num=document.getElementById('new-num').value.trim();
  const sub=document.getElementById('new-sub').value.trim();
  const targetRaw=document.getElementById('new-target').value.trim();
  if(!num||!sub)return;
  const target=targetRaw===''?null:parseFloat(targetRaw);
  DATA[cls][sess].push({sub,num,target:Number.isFinite(target)?target:null});
  saveData();
  document.getElementById('new-num').value='';
  document.getElementById('new-sub').value='';
  document.getElementById('new-target').value='';
  render();
}

function deleteCar(cls,sess,index){
  if(!canEditMaster())return;
  const car=DATA[cls]?.[sess]?.[index];
  if(!car||!confirm('ลบรถเบอร์ '+car.num+' ?'))return;
  DATA[cls][sess].splice(index,1);
  delete weights[key(cls,sess,car.num)];
  saveData();
  saveWeights();
  render();
}

function resetData(){
  if(!canEditMaster())return;
  if(!confirm('Reset รายชื่อรถ น้ำหนักตั้งต้น และค่าน้ำหนักที่ key in ทั้งหมด?'))return;
  DATA=clone(DEFAULT_DATA);
  weights={};
  saveData();
  saveWeights();
  refreshClassOptions();
  render();
}

function refreshClassOptions(){
  const selectedClass=selClass.value;
  selClass.innerHTML='';
  Object.keys(DATA).forEach(c=>{
    const o=document.createElement('option');
    o.value=c;o.textContent=c;selClass.appendChild(o);
  });
  if(DATA[selectedClass])selClass.value=selectedClass;
  onClassChange();
}

function onClassChange(){
  const cls=selClass.value;
  const selectedSess=selSess.value;
  selSess.innerHTML='';
  Object.keys(DATA[cls]).forEach(s=>{
    const o=document.createElement('option');
    o.value=s;o.textContent=s;selSess.appendChild(o);
  });
  if(DATA[cls][selectedSess])selSess.value=selectedSess;
  render();
}

function pillClass(diff,pct,has){
  if(!has)return 'empty';
  if(diff<0)return 'over';
  if(Math.abs(pct)<=0.05)return 'ok';
  return 'warn';
}

function render(){
  const cls=selClass.value;
  const sess=selSess.value;
  const cars=(DATA[cls]&&DATA[cls][sess])||[];
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';

  let total=cars.length,counted=0,ok=0,warn=0,under=0;

  cars.forEach((car,i)=>{
    const w1=getW(cls,sess,car.num,'w1');
    const w2=getW(cls,sess,car.num,'w2');
    const has=w1>0||w2>0;
    const tot=has?w1+w2:null;
    const diff=(tot!==null&&car.target!=null)?tot-car.target:null;
    const pct=(diff!==null&&car.target)?diff/car.target:null;

    if(has)counted++;
    if(has&&diff!==null){
      if(diff<0)under++;
      else if(pct!==null&&Math.abs(pct)<=0.05)ok++;
      else warn++;
    }

    const pc=diff!==null?pillClass(diff,pct,has):'empty';
    const diffTxt=diff!==null?(diff>=0?'+':'')+diff.toFixed(1)+' kg':'—';
    const pctTxt=pct!==null?(pct*100).toFixed(2)+'%':'—';

    const tr=document.createElement('tr');
    const safeCls=jsArg(cls);
    const safeSess=jsArg(sess);
    const safeNum=jsArg(car.num);
    const weight1Cell=canKeyIn()
      ? `<input type="text" inputmode="decimal" value="${attr(fmtWeight(w1))}" placeholder="0" onchange="setW(${safeCls},${safeSess},${safeNum},'w1',this.value)">`
      : `<span class="readonly-val">${w1?escapeHtml(w1):'—'}</span>`;
    const weight2Cell=canKeyIn()
      ? `<input type="text" inputmode="decimal" value="${attr(fmtWeight(w2))}" placeholder="0" onchange="setW(${safeCls},${safeSess},${safeNum},'w2',this.value)">`
      : `<span class="readonly-val">${w2?escapeHtml(w2):'—'}</span>`;
    const numCell=canEditMaster()
      ? `<input type="text" value="${attr(car.num)}" onchange="setCarField(${safeCls},${safeSess},${i},'num',this.value)">`
      : `<span class="num-badge">${escapeHtml(car.num)}</span>`;
    const subCell=canEditMaster()
      ? `<input type="text" value="${attr(car.sub)}" onchange="setCarField(${safeCls},${safeSess},${i},'sub',this.value)">`
      : `<span class="sub-tag">${escapeHtml(car.sub)}</span>`;
    const targetCell=canEditMaster()
      ? `<input type="number" step="0.01" value="${attr(car.target??'')}" placeholder="-" onchange="setCarField(${safeCls},${safeSess},${i},'target',this.value)">`
      : targetText(car.target);
    const actionCell=canEditMaster()
      ? `<td class="action-col"><button type="button" class="danger" onclick="deleteCar(${safeCls},${safeSess},${i})">ลบ</button></td>`
      : '';
    tr.innerHTML=`
      <td style="color:#aaa;font-size:12px">${i+1}</td>
      <td>${numCell}</td>
      <td>${subCell}</td>
      <td class="target-val">${targetCell}</td>
      <td>${weight1Cell}</td>
      <td>${weight2Cell}</td>
      <td class="total-val">${tot!==null?tot.toFixed(1):'<span style="color:#ccc">—</span>'}</td>
      <td><span class="pill ${pc}">${diffTxt}</span></td>
      <td class="pct-text">${pctTxt}</td>
      ${actionCell}
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('summary').innerHTML=`
    <div class="stat"><div class="stat-label">รถทั้งหมด</div><div class="stat-val">${total}</div></div>
    <div class="stat"><div class="stat-label">ชั่งแล้ว</div><div class="stat-val">${counted}</div></div>
    <div class="stat"><div class="stat-label">ผ่าน ≤5%</div><div class="stat-val ok">${ok}</div></div>
    <div class="stat"><div class="stat-label">เกิน &gt;5%</div><div class="stat-val warn">${warn}</div></div>
    <div class="stat"><div class="stat-label">ต่ำกว่า target</div><div class="stat-val bad">${under}</div></div>
  `;
}

function initApp(){
  const user=currentUser();
  if(!user){
    document.body.className='';
    return;
  }
  document.body.className='authed role-'+user.role;
  document.getElementById('active-user').textContent=user.username;
  document.getElementById('active-role').textContent=user.label;
  refreshClassOptions();
}

initApp();
</script>
</body>
</html>
